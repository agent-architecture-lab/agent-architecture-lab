[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "community-ops"
version = "0.1.0"
description = "Deterministic community operations agent"
requires-python = ">=3.12"
dependencies = ["openai>=1,<2", "pydantic>=2,<3", "pynacl>=1.5,<2"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
