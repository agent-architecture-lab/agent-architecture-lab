AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Community operations dev workflow — uses Lambda and Standard Step Functions for a fixed, auditable route.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: Discord ingress -> Lambda -> Standard Step Functions -> stage Lambdas -> result Lambda
    must:
      - dev only; no database, VPC, container, or production resource
      - workflow state contains no secret or personal data
    ref:
      - docs/superpowers/specs/2026-10-03-001-agent-architecture-lab-design.md

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev]
    Description: Deployment environment. This stack supports dev only.
  OpenAISecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret holding the OpenAI API key.
  FaqModel:
    Type: String
    Description: Owner-approved chat model for FAQ answers.
  DiscordApplicationId:
    Type: String
    Description: Discord application ID used for result delivery.
  DiscordPublicKey:
    Type: String
    Description: Discord interaction public key used to verify incoming requests.
  BudgetAlertEmail:
    Type: String
    NoEcho: true
    Description: Email address for 5, 8, and 10 USD monthly budget alerts.
  OperationsAlarmTopicArn:
    Type: String
    AllowedPattern: "arn:[a-z0-9-]+:sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+"
    Description: Existing owner-approved SNS topic for dev operational alarms.

Resources:
  AskPayloadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAbandonedAskPayloads
            Status: Enabled
            ExpirationInDays: 1

  AskPayloadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AskPayloadBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AskPayloadBucket.Arn
              - !Sub "${AskPayloadBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  DiscordApi:
    Type: AWS::Serverless::HttpApi

  DiscordIngressFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/
      Handler: handlers.discord_ingress.lambda_handler
      Runtime: python3.12
      MemorySize: 512
      Timeout: 10
      Environment:
        Variables:
          DISCORD_PUBLIC_KEY: !Ref DiscordPublicKey
          DISCORD_DISPATCH_FUNCTION_NAME: !Ref DiscordDispatchFunction
      Policies:
        - Statement:
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt DiscordDispatchFunction.Arn
      Events:
        Interactions:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscordApi
            Path: /discord/interactions
            Method: POST

  DiscordDispatchFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Decouples Discord's three-second acknowledgement from durable workflow startup.
        must:
          - accepts only the minimal signed interaction payload from DiscordIngressFunction
          - uses the interaction ID as the Standard workflow execution name
          - never logs interaction tokens or request bodies
    Properties:
      CodeUri: ../src/
      Handler: handlers.discord_dispatch.lambda_handler
      Runtime: python3.12
      Timeout: 10
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 120
        MaximumRetryAttempts: 1
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref CommunityWorkflow
          ASK_PAYLOAD_BUCKET: !Ref AskPayloadBucket
      Policies:
        - Statement:
            Effect: Allow
            Action: states:StartExecution
            Resource: !Ref CommunityWorkflow
        - Statement:
            Effect: Allow
            Action: s3:PutObject
            Resource:
              - !Sub "${AskPayloadBucket.Arn}/question/*"
              - !Sub "${AskPayloadBucket.Arn}/token/*"

  DiscordResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/
      Handler: handlers.discord_result.lambda_handler
      Runtime: python3.12
      Timeout: 10
      Environment:
        Variables:
          DISCORD_APPLICATION_ID: !Ref DiscordApplicationId
          ASK_PAYLOAD_BUCKET: !Ref AskPayloadBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub "${AskPayloadBucket.Arn}/token/*"
                - !Sub "${AskPayloadBucket.Arn}/answer/*"
            - Effect: Allow
              Action: s3:DeleteObject
              Resource:
                - !Sub "${AskPayloadBucket.Arn}/question/*"
                - !Sub "${AskPayloadBucket.Arn}/token/*"
                - !Sub "${AskPayloadBucket.Arn}/answer/*"

  ScreeningFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/
      Handler: handlers.stages.screening_handler
      Runtime: python3.12
      Timeout: 10
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment

  MatchingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/
      Handler: handlers.stages.matching_handler
      Runtime: python3.12
      Timeout: 10
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment

  FaqFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/
      Handler: handlers.stages.faq_workflow_handler
      Runtime: python3.12
      Timeout: 20
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          OPENAI_SECRET_ARN: !Ref OpenAISecretArn
          FAQ_MODEL: !Ref FaqModel
          ASK_PAYLOAD_BUCKET: !Ref AskPayloadBucket
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref OpenAISecretArn
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${AskPayloadBucket.Arn}/question/*"
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${AskPayloadBucket.Arn}/answer/*"

  ReflectionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/
      Handler: handlers.stages.reflection_handler
      Runtime: python3.12
      Timeout: 10
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment

  ScreeningLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ScreeningFunction}"
      RetentionInDays: 7

  MatchingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MatchingFunction}"
      RetentionInDays: 7

  FaqLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FaqFunction}"
      RetentionInDays: 7

  ReflectionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ReflectionFunction}"
      RetentionInDays: 7

  DiscordIngressLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DiscordIngressFunction}"
      RetentionInDays: 7

  DiscordResultLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DiscordResultFunction}"
      RetentionInDays: 7

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/states/${AWS::StackName}-community"
      RetentionInDays: 7

  DiscordIngressFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: Makes failed Discord acknowledgements visible during dev test bed runs.
        must:
          - evaluates only the ingress Lambda Errors metric
          - treats missing data as non-breaching
    Properties:
      AlarmDescription: community-ops dev Discord ingress Lambda errors
      AlarmActions: [!Ref OperationsAlarmTopicArn]
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DiscordIngressFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DiscordDispatchFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: Makes asynchronous dispatch failures visible before they become missing Discord results.
        must:
          - evaluates only the dispatch Lambda Errors metric
          - treats missing data as non-breaching
    Properties:
      AlarmDescription: community-ops dev Discord dispatch Lambda errors
      AlarmActions: [!Ref OperationsAlarmTopicArn]
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DiscordDispatchFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CommunityWorkflowFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: Separates workflow execution failures from Lambda invocation failures in the dev test bed.
        must:
          - evaluates only the Standard workflow ExecutionsFailed metric
          - treats missing data as non-breaching
    Properties:
      AlarmDescription: community-ops dev Step Functions execution failures
      AlarmActions: [!Ref OperationsAlarmTopicArn]
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref CommunityWorkflow
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DiscordResultFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: Makes failed final Discord message updates visible during dev test bed runs.
        must:
          - evaluates only the result Lambda Errors metric
          - treats missing data as non-breaching
    Properties:
      AlarmDescription: community-ops dev Discord result Lambda errors
      AlarmActions: [!Ref OperationsAlarmTopicArn]
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DiscordResultFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CommunityWorkflowTimeoutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: community-ops dev Step Functions executions missing their deadline
      AlarmActions: [!Ref OperationsAlarmTopicArn]
      Namespace: AWS/States
      MetricName: ExecutionsTimedOut
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref CommunityWorkflow
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DiscordDispatchDroppedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: community-ops dev queued Discord events dropped before completion
      AlarmActions: [!Ref OperationsAlarmTopicArn]
      Namespace: AWS/Lambda
      MetricName: AsyncEventsDropped
      Dimensions:
        - Name: FunctionName
          Value: !Ref DiscordDispatchFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DevMonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetLimit:
          Amount: "10"
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 5
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 8
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 10
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

  CommunityWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
        IncludeExecutionData: false
        Level: ERROR
      Policies:
        - Statement:
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource:
              - !GetAtt ScreeningFunction.Arn
              - !GetAtt MatchingFunction.Arn
              - !GetAtt FaqFunction.Arn
              - !GetAtt ReflectionFunction.Arn
              - !GetAtt DiscordResultFunction.Arn
        - Statement:
            Effect: Allow
            Action:
              - logs:CreateLogDelivery
              - logs:GetLogDelivery
              - logs:UpdateLogDelivery
              - logs:DeleteLogDelivery
              - logs:ListLogDeliveries
              - logs:PutResourcePolicy
              - logs:DescribeResourcePolicies
              - logs:DescribeLogGroups
            Resource: "*"
      Definition:
        StartAt: FAQ
        TimeoutSeconds: 60
        States:
          FAQ:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt FaqFunction.Arn
              Payload.$: "$"
            ResultPath: "$.faq"
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: null
                Next: ResultDelivery
            Next: ResultDelivery
          ResultDelivery:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt DiscordResultFunction.Arn
              Payload.$: "$"
            End: true

Outputs:
  StateMachineArn:
    Description: ARN of the dev-only community workflow.
    Value: !Ref CommunityWorkflow
  DiscordInteractionEndpoint:
    Description: Set this URL as the Discord interaction endpoint.
    Value: !Sub "https://${DiscordApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/discord/interactions"
