name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: aws-actions/setup-sam@v2
      - run: uv sync --all-groups
      - run: uv run pytest -q
      - run: sam validate --lint --template-file infra/template.yaml
